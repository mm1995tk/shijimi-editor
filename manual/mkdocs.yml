site_name: shijimi 説明書
site_description: ターミナルで動く統合開発環境 shijimi の説明書
site_url: https://shijimi-manual.pages.dev/
repo_url: https://github.com/mm1995tk/shijimi-editor
repo_name: mm1995tk/shijimi-editor
edit_uri: edit/main/manual/docs/

theme:
  name: material
  language: ja
  logo: assets/icon.png
  favicon: assets/icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードにする
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードにする
  features:
    - navigation.sections
    - navigation.footer
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.keys

nav:
  - はじめに:
      - 概要: index.md
      - インストールと起動: install.md
      - 画面の見方: screen.md
  - 使い方:
      - 編集（Helix モード）: editing-helix.md
      - 編集（VS Code モード）: editing-vscode.md
      - ファイルと検索: files.md
      - LSP: lsp.md
      - 差分モード: review.md
      - プレビュー: preview.md
      - ターミナル: terminal.md
      - 外部ブラウザとポート転送: browser.md
      - AI エージェント連携: agent.md
  - 設定:
      - 設定ファイル: config.md
      - Nix と home-manager: nix.md
  - 一覧:
      - ":コマンド一覧": commands.md
      - 制限: limitations.md
