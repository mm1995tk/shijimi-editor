[package]
name = "shijimi-editor-gui"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "GUI for shijimi-editor (Tauri shell)"

[build-dependencies]
tauri-build = "=2.7.3"

[dependencies]
tauri = "=2.12.4"

[features]
# release の画面は埋め込んだ Web を使う（これが無いと devUrl を見に行く）。cargo tauri build は自動で付ける
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
