name: リリース

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "上げるバージョンの桁"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.ver.outputs.next }}
    steps:
      - name: main 以外では実行しない
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::main ブランチで実行してください（現在: $GITHUB_REF）"
          exit 1

      - uses: actions/checkout@v7
        with:
          # release ブランチを早送りで進めるとき、git が今の release が新しいコミットの祖先だと確かめられるよう、
          # 履歴を全部取る（1 コミット分だけだと push が拒否される）。
          fetch-depth: 0

      - name: バージョンを上げる
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current=$(sed -n 's/^ *version = "\([0-9]*\.[0-9]*\.[0-9]*\)";$/\1/p' flake.nix)
          if [ "$(printf '%s\n' "$current" | wc -l)" != 1 ] || [ -z "$current" ]; then
            echo "::error::flake.nix から X.Y.Z 形式の version を1つ読めませんでした"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"
          if git ls-remote --exit-code --tags origin "refs/tags/v$next" >/dev/null; then
            echo "::error::タグ v$next はすでにあります"
            exit 1
          fi
          sed -i "s/^\( *version = \)\"$current\";$/\1\"$next\";/" flake.nix
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: コミットしてタグを打つ
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "v$NEXT"
          git tag "v$NEXT"
          # コミット・タグ・release ブランチを同時に push する（どれかが失敗したら全部失敗する）。
          # release ブランチは最新のリリースを指し、Nix の利用者は github:mm1995tk/shijimi-editor/release で
          # main の未リリースの変更を取らずに済む。
          git push --atomic origin HEAD:main HEAD:refs/heads/release "v$NEXT"

      - name: GitHub Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: gh release create "v$NEXT" --title "v$NEXT" --generate-notes --verify-tag

  # 打ったタグから OS と CPU ごとの shj をビルドし、npm のパッケージ（tarball）にする。publish はしない
  npm-pack:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.next }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
      - name: パッケージを作る
        env:
          NEXT: ${{ needs.release.outputs.next }}
        run: npm/pack.sh "$NEXT" "$RUNNER_TEMP/npm"
      # tarball のまま渡す（upload-artifact は zip にするとき実行権限を落とすので、bin/shj の権限は tarball の中に残す）
      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error
          retention-days: 1

  # npm-pack が作った tarball を publish する。ここではビルドもパッケージのスクリプトの実行もしない
  npm-publish:
    needs: [release, npm-pack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm の Trusted Publishing（OIDC）に使う。トークンは Secrets に置かない
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          # OIDC での認証には npm 11.5.1 以降が要る。Node.js 26.12.1 に付いてくる npm はそれより新しい
          node-version: 26.12.1
      - uses: actions/download-artifact@v8
        with:
          name: npm
          path: ${{ runner.temp }}/npm
      - name: npm に publish する
        # shijimi-editor は OS と CPU ごとのパッケージに依存するので、それらを先に publish する。
        # npm にもうあるバージョンは飛ばすので、途中で失敗してもこのジョブの再実行だけで残りを publish できる
        env:
          NEXT: ${{ needs.release.outputs.next }}
        run: |
          cd "$RUNNER_TEMP/npm"
          for f in shijimi-editor-*-*-*.tgz shijimi-editor-[0-9]*.tgz; do
            name="${f%-"$NEXT".tgz}"
            if npm view "$name@$NEXT" version >/dev/null 2>&1; then
              echo "$name@$NEXT はもう npm にあるので飛ばす"
              continue
            fi
            npm publish "$f" --access public --ignore-scripts
          done

  # npm-pack がビルドした shj を、そのまま GitHub Release にも置く。Go のモジュールを取りに行けない
  # プロキシの内側でも、github.com からダウンロードするだけで入れられるようにするため
  release-assets:
    needs: [release, npm-pack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm
          path: ${{ runner.temp }}/npm
      - name: GitHub Release に上げる
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ needs.release.outputs.next }}
        run: |
          cd "$RUNNER_TEMP"
          mkdir assets
          # shijimi-editor-<os>-<cpu>-X.Y.Z.tgz の package/bin/shj を shj-<os>-<cpu> にする
          for f in npm/shijimi-editor-*-*-"$NEXT".tgz; do
            platform="$(basename "${f%-"$NEXT".tgz}")"
            platform="${platform#shijimi-editor-}"
            tar -xzf "$f" -O package/bin/shj > "assets/shj-$platform"
          done
          # 再実行で上げ直せるよう、同じ名前のアセットは置き換える
          gh release upload "v$NEXT" assets/* --clobber --repo "$GITHUB_REPOSITORY"
