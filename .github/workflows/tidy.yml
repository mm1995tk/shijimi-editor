name: リポジトリが整っているか確かめる

# scripts/tidy.sh（go mod tidy / gomod2nix / go fix / nix fmt）を動かして、差分が出ないことを確かめる。
# CI は直さない。差分が出たら、手元で同じスクリプトを動かして、結果をコミットする。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tidy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: scripts/tidy.sh を動かす
        run: nix develop -c scripts/tidy.sh
      - name: 差分が無いことを確かめる
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git --no-pager diff
            git status --porcelain
            echo "::error::scripts/tidy.sh を動かすと差分が出ます。手元で nix develop -c scripts/tidy.sh を実行して、結果をコミットしてください"
            exit 1
          fi
