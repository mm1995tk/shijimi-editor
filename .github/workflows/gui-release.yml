name: GUI を配る

# GUI（ui/gui/app/）の AppImage と署名なしの .dmg を作り、自動更新（Tauri の updater）の latest.json と一緒に
# GitHub Release に上げる（C8。#325）。kisui-terminal-release.yml（GUI の版のリリース）と nightly.yml（nightly）から呼ぶ。
# shj のリリース（release.yml）からは呼ばない。GUI の版は shj の版とは別（#581）。
#
# - GUI の版のリリース：タグ kisui-terminal-v<版> の Release に kisui-terminal-*。
#   Release の「Latest」の印は shj のリリースのまま（--latest=false）。updater は、決まったタグ kisui-terminal-latest の
#   pre-release に置いた latest.json を見る（GUI のリリースだけを指す。リリースのたびに置き換える）。
# - nightly：pre-release kisui-terminal-nightly に kisui-terminal-nightly-*（tauri.nightly.conf.json を重ねる）。
#   updater は同じ pre-release の latest.json を見る。名前と identifier が違うので、普通の版と並べて入れられる。
# - どちらの Release にも、リモートに入れる kisui-<os>-<cpu> と shj-<os>-<cpu>（nightly は kisui-nightly-…）と SHA256SUMS を
#   上げる（install.rs が取る）。shj は GUI の版に対応する版（shj_version）で、Release の説明にその版を書く。
# - 自動更新を持つのは、ここで作る AppImage と .dmg だけ（cargo の feature updater）。Nix で作る版は持たない。
#
# 上げるもの（<名前> は kisui-terminal か kisui-terminal-nightly）:
#   <名前>-linux-x86_64.AppImage(.sig)、<名前>-linux-aarch64.AppImage(.sig)、
#   <名前>-macos-universal.dmg、<名前>-macos-universal.app.tar.gz(.sig)、latest.json
#
# 署名鍵（minisign、パスワードなし）は 1Password の vault shijimi-editor-release の item
# shijimi-editor-tauri-updater-key にあり、サービスアカウント（トークンは item shijimi-editor-release-op-token。
# GitHub の Secret OP_SERVICE_ACCOUNT_TOKEN_RELEASE）で、ビルドの直前に読む。公開鍵は tauri.conf.json の
# plugins.updater.pubkey。鍵を替えたら pubkey も替える（古い版は新しい鍵の更新を受けつけない）。
#
# ここだけは Nix（devShell）を使わず、各 OS の Node・rustup・システムの WebView でビルドする。
# 配る AppImage と .dmg は Nix の無いマシンで動く必要があり、Nix で作ると /nix/store のライブラリを指してしまうため。
# macOS の universal（2 つの CPU 向けを 1 つにする）にも、rustup で足すターゲットが要る。

on:
  workflow_call:
    inputs:
      version:
        description: "GUI の版（X.Y.Z か X.Y.Z-nightly.<yyyymmdd>.<sha>）"
        type: string
        required: true
      shj_version:
        description: "同梱する shj の版（X.Y.Z か X.Y.Z-nightly.<yyyymmdd>.<sha>）。GUI の版とは別"
        type: string
        required: true
      tag:
        description: "上げる先の Release のタグ（kisui-terminal-v<版> か kisui-terminal-nightly）。無ければ publish ジョブが作る"
        type: string
        required: true
      ref:
        description: "ビルドするコミット"
        type: string
        required: true
      channel:
        description: "空なら普通の版、nightly なら nightly 版"
        type: string
        default: ""
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN_RELEASE:
        required: true

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          # Intel と Apple シリコンの両方で動く 1 つの .app にする
          - os: macos-latest
            platform: macos-universal
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Rust を用意する
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          if [ "$TARGET" = universal-apple-darwin ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Linux の WebView と AppImage の道具を入れる
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: npm ci
        run: npm ci

      # GUI と一緒に配る kisui と shj（Tauri の externalBin）。GUI と同じ版・コミットで作る。Go は runner のもの（go.mod の版は GOTOOLCHAIN=auto で取る）
      - name: kisui と shj を作る
        env:
          VERSION: ${{ inputs.version }}
          SHJ_VERSION: ${{ inputs.shj_version }}
          TARGET: ${{ matrix.target }}
        run: packaging/gui/build-kisui.sh "$VERSION" "$SHJ_VERSION" ${TARGET:+macos}

      # 版と（nightly なら）名前・取り先と、同梱する kisui と shj（externalBin）を、tauri build --config で重ねる設定にまとめる
      - name: 設定を作る
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          base='{}'
          if [ "$CHANNEL" = nightly ]; then
            base=$(cat ui/gui/app/src-tauri/tauri.nightly.conf.json)
          fi
          printf '%s' "$base" | jq --arg v "$VERSION" '. * {version: $v, bundle: {externalBin: ["binaries/kisui", "binaries/shj"]}}' > "$RUNNER_TEMP/tauri.json"
          cat "$RUNNER_TEMP/tauri.json"

      # 署名鍵はこの step から後でだけ環境変数にある（npm ci などの依存のスクリプトには渡さない）
      - name: 署名鍵を 1Password から読む
        uses: 1password/load-secrets-action@5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_RELEASE }}
          TAURI_SIGNING_PRIVATE_KEY: op://shijimi-editor-release/shijimi-editor-tauri-updater-key/credential

      - name: tauri build
        env:
          # 鍵にパスワードは付けていない（秘密鍵は 1Password にしか置かないので、足しても守りは強くならない）
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Tauri の CLI は tauri.conf.json を 3 段の深さまでしか探さない（TAURI_CLI_CONFIG_DEPTH）。
          # ui/gui/app/src-tauri/ はそれより深いので、殻と画面（package.json）の場所を直に渡す
          TAURI_APP_PATH: ui/gui/app/src-tauri
          TAURI_FRONTEND_PATH: .
          TARGET: ${{ matrix.target }}
        run: |
          args=(--features updater --config "$RUNNER_TEMP/tauri.json")
          if [ -n "$TARGET" ]; then
            args+=(--target "$TARGET" --bundles "app,dmg")
          else
            args+=(--bundles appimage)
          fi
          npx tauri build "${args[@]}"

      - name: 決まった名前に並べる
        env:
          CHANNEL: ${{ inputs.channel }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          name=kisui-terminal
          if [ "$CHANNEL" = nightly ]; then
            name=kisui-terminal-nightly
          fi
          bundle="target/${TARGET:+$TARGET/}release/bundle"
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          one() {
            # glob が 1 つだけに当たることを確かめる（版の付いた名前は Tauri が決める）
            # shellcheck disable=SC2206 # わざと glob を展開する
            local files=($1)
            if [ "${#files[@]}" != 1 ] || [ ! -e "${files[0]}" ]; then
              echo "::error::$1 に当たるファイルが 1 つではありません: ${files[*]}"
              exit 1
            fi
            printf '%s' "${files[0]}"
          }
          if [ "$RUNNER_OS" = Linux ]; then
            cp "$(one "$bundle/appimage/*.AppImage")" "$out/$name-$PLATFORM.AppImage"
            cp "$(one "$bundle/appimage/*.AppImage.sig")" "$out/$name-$PLATFORM.AppImage.sig"
          else
            cp "$(one "$bundle/dmg/*.dmg")" "$out/$name-$PLATFORM.dmg"
            cp "$(one "$bundle/macos/*.app.tar.gz")" "$out/$name-$PLATFORM.app.tar.gz"
            cp "$(one "$bundle/macos/*.app.tar.gz.sig")" "$out/$name-$PLATFORM.app.tar.gz.sig"
          fi
          ls -l "$out"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gui-${{ matrix.platform }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 1

  # リモートに入れる kisui と shj（install.rs が取る）と SHA256SUMS。ssh 先は Linux と macOS の x64 と arm64
  remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Go は runner のもの（go.mod の版は GOTOOLCHAIN=auto で取る）
      - name: kisui と shj を作る
        env:
          VERSION: ${{ inputs.version }}
          SHJ_VERSION: ${{ inputs.shj_version }}
        run: packaging/gui/build-remote.sh "$VERSION" "$SHJ_VERSION" "$RUNNER_TEMP/remote"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gui-remote
          path: ${{ runner.temp }}/remote/*
          if-no-files-found: error
          retention-days: 1

  # 3 つのビルドがそろってから上げる（latest.json が、まだ無いファイルを指さないように）
  publish:
    needs: [bundle, remote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: gui-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets
      - name: latest.json を作って Release に上げる
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          SHJ_VERSION: ${{ inputs.shj_version }}
          REF: ${{ inputs.ref }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          cd "$RUNNER_TEMP/assets"
          name=kisui-terminal
          if [ "$CHANNEL" = nightly ]; then
            name=kisui-terminal-nightly
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          entry() { # <ファイル>
            jq -n --arg url "$base/$1" --rawfile sig "$1.sig" '{url: $url, signature: ($sig | rtrimstr("\n"))}'
          }
          mac=$(entry "$name-macos-universal.app.tar.gz")
          # Tauri の updater の静的な JSON の形（https://v2.tauri.app/plugin/updater/）
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --argjson linux_x64 "$(entry "$name-linux-x86_64.AppImage")" \
            --argjson linux_arm "$(entry "$name-linux-aarch64.AppImage")" \
            --argjson mac "$mac" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {
              "linux-x86_64": $linux_x64,
              "linux-aarch64": $linux_arm,
              "darwin-aarch64": $mac,
              "darwin-x86_64": $mac
            }}' > latest.json
          cat latest.json
          # Release を用意する。説明には同梱した shj の版を書く
          {
            echo "- GUI の版: \`$VERSION\`"
            echo "- 同梱した shj の版: \`$SHJ_VERSION\`"
            echo "- コミット: https://github.com/$GITHUB_REPOSITORY/commit/$REF"
          } > "$RUNNER_TEMP/notes.md"
          if [ "$CHANNEL" = nightly ]; then
            # nightly の pre-release は作り直す（古い assets を残さず、タグはそのコミットに付け直す）
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" --prerelease \
              --title "kisui-terminal nightly ($VERSION)" --notes-file "$RUNNER_TEMP/notes.md"
          elif ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # shj の「Latest」を奪わないよう、--latest=false で作る
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" --latest=false \
              --title "kisui-terminal v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          # 再実行で上げ直せるよう、同じ名前のアセットは置き換える
          gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"
          # 普通の版は、自動更新の取り先 kisui-terminal-latest にも latest.json を置く（Latest の印は付けない pre-release）。
          # GUI のリリースだけを指すので、shj のリリースが混ざっても壊れない
          if [ "$CHANNEL" != nightly ]; then
            pointer=kisui-terminal-latest
            if ! gh release view "$pointer" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$pointer" --repo "$GITHUB_REPOSITORY" --target "$REF" --prerelease --latest=false \
                --title "kisui-terminal の自動更新の取り先" \
                --notes "kisui-terminal の自動更新（Tauri の updater）が見る latest.json を置く場所です。GUI のリリースのたびに latest.json を置き換えます。ダウンロードするものはありません。"
            fi
            gh release upload "$pointer" latest.json --clobber --repo "$GITHUB_REPOSITORY"
          fi
