name: 検査

# flake の checks（nix flake check）を Linux と macOS で回す。手元の nix flake check と同じもの:
#   formatting   … nix fmt で差分が出ない
#   go-test      … go test ./...（Linux だけ。macOS は devShell の中で go test ./... を回す）
#
# Nix store は GitHub Actions のキャッシュに残し、依存を毎回ビルドし直さないようにする。キーは依存を決める
# ファイル（*.nix・flake.lock・各ロックファイル）のハッシュ。保存するのは main の push だけで、PR は main の
# キャッシュを読むだけにする（PR ごとのキャッシュで容量の上限 10 GB を埋めないため）。main で保存するときは
# 同じ job の古いキャッシュを消す（そのために actions: write が要る）。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        # macOS の runner が割り当てられず 15 分で cancelled になる状態が続くので、一旦外す。
        # 直ったら macos-latest を戻す。
        # os: [ubuntu-latest, macos-latest]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-check-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix', 'gomod2nix.toml') }}
          restore-prefixes-first-match: nix-check-${{ runner.os }}-
          save: ${{ github.event_name == 'push' }}
          purge: ${{ github.event_name == 'push' }}
          purge-prefixes: nix-check-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: nix flake check
        run: nix flake check --print-build-logs
      # macOS の Nix のビルド環境では Go のテストが前提にする環境にならない（flake.nix の checks を見よ）ので、
      # 手元と同じ devShell の中で回す
      - name: go test ./...（macOS）
        if: runner.os == 'macOS'
        run: nix develop --command go test ./...
